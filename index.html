<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gestão+</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestão+">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F8;
    --surface:#FFFFFF;
    --ink:#1B2430;
    --muted:#6B7684;
    --primary:#1F3A5F;
    --primary-dark:#152A45;
    --accent:#E8A33D;
    --accent-ink:#5A3B0A;
    --danger:#C1443C;
    --success:#2F855A;
    --border:#E2E5EA;
    --radius:6px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:14px;
    line-height:1.5;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  #app{display:flex; min-height:100vh;}

  /* SIDEBAR */
  #sidebar{
    width:220px; flex-shrink:0;
    background:var(--primary);
    color:#EAF0F7;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  #sidebar .brand{
    padding:20px 18px 16px;
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  #sidebar .brand strong{font-size:16px; font-weight:700; display:block;}
  #sidebar .brand span{font-size:11px; color:#9BB2CC; letter-spacing:0.03em;}
  nav.modules{flex:1; padding:10px 0;}
  nav.modules button{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left;
    padding:10px 18px;
    background:none; border:none;
    border-left:3px solid transparent;
    color:#C9D6E5; font-size:13.5px; font-weight:500;
    cursor:pointer;
    font-family:inherit;
  }
  nav.modules button:hover{background:rgba(255,255,255,0.06); color:#fff;}
  nav.modules button.active{
    background:rgba(255,255,255,0.09);
    border-left-color:var(--accent);
    color:#fff;
  }
  nav.modules .ico{width:18px; text-align:center; font-size:14px;}
  #sidebar .foot{padding:14px 18px; font-size:11px; color:#8098B5; border-top:1px solid rgba(255,255,255,0.12);}

  /* MAIN */
  main{flex:1; padding:26px 32px; max-width:1180px;}
  .topbar{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:22px; flex-wrap:wrap; gap:12px;
  }
  .topbar h1{font-size:21px; font-weight:700;}
  .topbar p{color:var(--muted); font-size:13px; margin-top:2px;}
  .btn{
    background:var(--primary); color:#fff; border:none;
    padding:9px 16px; border-radius:var(--radius);
    font-size:13.5px; font-weight:600; cursor:pointer;
    font-family:inherit;
  }
  .btn:hover{background:var(--primary-dark);}
  .btn.accent{background:var(--accent); color:var(--accent-ink);}
  .btn.accent:hover{filter:brightness(0.95);}
  .btn.ghost{background:none; border:1px solid var(--border); color:var(--ink);}
  .btn.ghost:hover{background:var(--bg);}
  .btn.danger{background:#fff; border:1px solid var(--danger); color:var(--danger);}
  .btn.small{padding:5px 10px; font-size:12px;}

  .grid{display:grid; gap:16px;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:20px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px;
  }
  .stat .label{font-size:12px; color:var(--muted); font-weight:500;}
  .stat .value{font-size:22px; font-weight:700; margin-top:4px; font-family:'IBM Plex Mono',monospace;}
  .stat .value.pos{color:var(--success);}
  .stat .value.neg{color:var(--danger);}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:18px;}
  .panel h2{font-size:15px; font-weight:700; margin-bottom:12px;}
  .panel h3{font-size:13px; font-weight:600; margin:14px 0 8px; color:var(--muted);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; padding:8px 10px; color:var(--muted); font-weight:600;
    border-bottom:1px solid var(--border); font-size:12px;
  }
  td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .empty{color:var(--muted); font-style:italic; padding:16px 10px; text-align:center;}

  .badge{
    display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:600;
  }
  .badge.green{background:#E4F3EA; color:var(--success);}
  .badge.red{background:#FBEAE9; color:var(--danger);}
  .badge.amber{background:#FCEFDA; color:#8A5A0F;}
  .badge.gray{background:#EEF0F2; color:var(--muted);}

  input, select, textarea{
    font-family:inherit; font-size:13.5px; padding:8px 10px;
    border:1px solid var(--border); border-radius:var(--radius);
    background:#fff; color:var(--ink); width:100%;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}

  /* PDV specific */
  .pdv-layout{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
  .product-pick{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px;
    cursor:pointer;
  }
  .product-pick:hover{border-color:var(--accent); background:#FFFBF3;}
  .product-pick .name{font-weight:600; font-size:13.5px;}
  .product-pick .meta{font-size:11.5px; color:var(--muted);}
  .cart-line{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .cart-total{display:flex; justify-content:space-between; font-size:17px; font-weight:700; margin-top:12px; padding-top:12px; border-top:2px solid var(--ink);}
  .qty-x{color:var(--danger); cursor:pointer; font-size:12px; margin-left:8px;}

  .modal-bg{position:fixed; inset:0; background:rgba(20,26,35,0.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal{background:#fff; border-radius:var(--radius); padding:22px; width:100%; max-width:420px; max-height:90vh; overflow-y:auto;}
  .modal h2{font-size:16px; margin-bottom:14px;}
  .modal-actions{display:flex; gap:10px; margin-top:16px; justify-content:flex-end;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:var(--radius);
    font-size:13.5px; z-index:100; box-shadow:0 4px 14px rgba(0,0,0,0.2);
  }

  .bar-chart{display:flex; align-items:flex-end; gap:8px; height:140px; padding-top:10px;}
  .bar-chart .bar{flex:1; background:var(--primary); border-radius:3px 3px 0 0; position:relative; min-height:2px;}
  .bar-chart .bar .val{position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:10.5px; font-family:'IBM Plex Mono',monospace; color:var(--muted);}
  .bar-chart .bar .lbl{position:absolute; bottom:-20px; left:0; right:0; text-align:center; font-size:10.5px; color:var(--muted);}

  .invoice-box{border:1px solid var(--border); padding:22px; border-radius:var(--radius); background:#fff;}
  .invoice-box .head{display:flex; justify-content:space-between; border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:12px;}
  .invoice-box .head h2{font-size:17px;}
  .invoice-box .head .num{font-family:'IBM Plex Mono',monospace; color:var(--muted); font-size:12px;}

  @media (max-width:820px){
    #app{flex-direction:column;}
    #sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto;}
    #sidebar .brand{display:none;}
    nav.modules{display:flex; padding:0;}
    nav.modules button{border-left:none; border-bottom:3px solid transparent; white-space:nowrap;}
    nav.modules button.active{border-left:none; border-bottom-color:var(--accent);}
    #sidebar .foot{display:none;}
    main{padding:18px;}
    .pdv-layout{grid-template-columns:1fr;}
    .row, .row3{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <strong>Gestão+</strong>
      <span>Sistema de gestão empresarial</span>
    </div>
    <nav class="modules" id="nav"></nav>
    <div class="foot">
      Dados salvos automaticamente<br>
      <button id="resetAllBtn" style="background:none; border:none; color:#E8A33D; font-size:11px; cursor:pointer; padding:6px 0 0; font-family:inherit; text-decoration:underline;">Apagar todos os dados</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ---------------- STORAGE HELPERS ---------------- */
const KEYS = {
  products:'erp:products', sales:'erp:sales', cash:'erp:cash', cashStatus:'erp:cashStatus',
  finance:'erp:finance', services:'erp:services', tickets:'erp:tickets', customers:'erp:customers'
};

async function loadAll(){
  const out = {};
  for(const [k,key] of Object.entries(KEYS)){
    try{
      const raw = localStorage.getItem(key);
      out[k] = raw ? JSON.parse(raw) : (k==='cashStatus' ? {open:false, openedAt:null, opening:0} : []);
    }catch(e){
      out[k] = (k==='cashStatus' ? {open:false, openedAt:null, opening:0} : []);
    }
  }
  return out;
}
async function save(key, value){
  try{ localStorage.setItem(KEYS[key], JSON.stringify(value)); }
  catch(e){ console.error('Erro ao salvar', key, e); toast('Erro ao salvar dados'); }
}

let state = {products:[], sales:[], cash:[], cashStatus:{open:false, openedAt:null, opening:0}, finance:[], services:[], tickets:[], customers:[]};
let cart = [];
let pdvState = {payMethod:'Dinheiro', customerId:'', term:'30', customDate:''};
let clientSearch = '';
let currentModule = 'dashboard';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ return 'R$ ' + (Number(n)||0).toFixed(2).replace('.', ','); }
function todayISO(){ return new Date().toISOString(); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

/* ---------------- SEED DATA (only on very first run ever) ---------------- */
function seedIfEmpty(){
  const seeded = localStorage.getItem('erp:seeded');
  if(!seeded && state.products.length===0){
    state.products = [
      {id:uid(), name:'Camiseta Básica', price:39.9, cost:18, stock:32, category:'Vestuário'},
      {id:uid(), name:'Caneca Personalizada', price:24.5, cost:9, stock:15, category:'Presentes'},
      {id:uid(), name:'Mochila Executiva', price:129.9, cost:60, stock:4, category:'Acessórios'},
      {id:uid(), name:'Garrafa Térmica', price:59.9, cost:25, stock:8, category:'Acessórios'},
    ];
    save('products', state.products);
  }
  localStorage.setItem('erp:seeded', '1');
}

/* ---------------- NAV / MODULES ---------------- */
const MODULES = [
  {id:'dashboard', label:'Painel', ico:'◆'},
  {id:'pdv', label:'PDV', ico:'▣'},
  {id:'caixa', label:'Caixa', ico:'$'},
  {id:'estoque', label:'Estoque', ico:'▦'},
  {id:'clientes', label:'Clientes', ico:'☺'},
  {id:'financeiro', label:'Financeiro', ico:'%'},
  {id:'servicos', label:'Serviços', ico:'✓'},
  {id:'relatorios', label:'Relatórios', ico:'▤'},
  {id:'notafiscal', label:'Nota Fiscal', ico:'▧'},
  {id:'suporte', label:'Suporte', ico:'?'},
];

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = MODULES.map(m => `
    <button data-mod="${m.id}" class="${currentModule===m.id?'active':''}">
      <span class="ico">${m.ico}</span> ${m.label}
    </button>
  `).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ currentModule=b.dataset.mod; render(); });
  });
}

/* ---------------- RENDER ROUTER ---------------- */
function render(){
  renderNav();
  const main = document.getElementById('main');
  const renderers = {
    dashboard: renderDashboard, pdv: renderPDV, caixa: renderCaixa, estoque: renderEstoque,
    clientes: renderClientes, financeiro: renderFinanceiro, servicos: renderServicos, relatorios: renderRelatorios,
    notafiscal: renderNotaFiscal, suporte: renderSuporte
  };
  main.innerHTML = renderers[currentModule]();
  attachHandlers(currentModule);
}

/* ================= DASHBOARD ================= */
function isSameDay(a,b){ return new Date(a).toDateString()===new Date(b).toDateString(); }
function isOverdue(dueDate){ const d=new Date(dueDate); d.setHours(23,59,59,999); return d < new Date() && !isSameDay(dueDate, new Date()); }

function renderDashboard(){
  const totalVendas = state.sales.reduce((s,v)=>s+v.total,0);
  const totalEstoque = state.products.reduce((s,p)=>s+p.stock,0);
  const aReceber = state.finance.filter(f=>f.type==='receber' && f.status==='pendente').reduce((s,f)=>s+f.amount,0);
  const aPagar = state.finance.filter(f=>f.type==='pagar' && f.status==='pendente').reduce((s,f)=>s+f.amount,0);
  const lowStock = state.products.filter(p=>p.stock<=5);
  const cobrancasHoje = state.finance.filter(f=>f.type==='receber' && f.status==='pendente' && (isSameDay(f.dueDate,new Date()) || isOverdue(f.dueDate)));

  return `
    <div class="topbar"><div><h1>Painel geral</h1><p>Visão rápida do seu negócio</p></div></div>
    ${cobrancasHoje.length ? `
    <div class="panel" style="border:1.5px solid var(--danger); background:#FFF7F6;">
      <h2 style="color:var(--danger);">⚠ Cobranças para hoje ou atrasadas</h2>
      <table><thead><tr><th>Cliente</th><th>Descrição</th><th>Vencimento</th><th>Valor</th></tr></thead><tbody>
        ${cobrancasHoje.map(f=>{
          const cust = state.customers.find(c=>c.id===f.customerId);
          return `<tr><td>${cust?cust.name:'—'}</td><td>${f.description}</td><td>${new Date(f.dueDate).toLocaleDateString('pt-BR')}</td><td class="mono">${fmt(f.amount)}</td></tr>`;
        }).join('')}
      </tbody></table>
    </div>` : ''}
    <div class="cards">
      <div class="card stat"><div class="label">Vendas totais (PDV)</div><div class="value mono">${fmt(totalVendas)}</div></div>
      <div class="card stat"><div class="label">Itens em estoque</div><div class="value mono">${totalEstoque}</div></div>
      <div class="card stat"><div class="label">A receber</div><div class="value mono pos">${fmt(aReceber)}</div></div>
      <div class="card stat"><div class="label">A pagar</div><div class="value mono neg">${fmt(aPagar)}</div></div>
    </div>
    <div class="panel">
      <h2>Estoque baixo</h2>
      ${lowStock.length ? `<table><thead><tr><th>Produto</th><th>Estoque</th></tr></thead><tbody>
        ${lowStock.map(p=>`<tr><td>${p.name}</td><td><span class="badge red">${p.stock} un.</span></td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">Nenhum produto com estoque baixo</div>`}
    </div>
    <div class="panel">
      <h2>Últimas vendas</h2>
      ${state.sales.length ? `<table><thead><tr><th>Data</th><th>Itens</th><th>Total</th><th>Pagamento</th><th></th></tr></thead><tbody>
        ${state.sales.slice(-5).reverse().map(s=>`<tr><td>${fmtDate(s.date)}</td><td>${s.items.length}</td><td class="mono">${fmt(s.total)}</td><td>${s.payment}</td><td><button class="btn danger small" data-delsale="${s.id}">Excluir</button></td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">Nenhuma venda registrada ainda. Vá em PDV para começar.</div>`}
    </div>
  `;
}

/* ================= PDV ================= */
function renderPDV(){
  const cartTotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const payMethod = pdvState.payMethod;
  return `
    <div class="topbar"><div><h1>PDV</h1><p>Ponto de venda</p></div>
      ${!state.cashStatus.open ? `<span class="badge red">Caixa fechado — abra o caixa antes de vender</span>` : `<span class="badge green">Caixa aberto</span>`}
    </div>
    <div class="pdv-layout">
      <div class="panel">
        <h2>Produtos</h2>
        ${state.products.length ? state.products.map(p=>`
          <div class="product-pick" data-add="${p.id}">
            <div><div class="name">${p.name}</div><div class="meta">${p.category} · ${p.stock} em estoque</div></div>
            <div class="mono" style="font-weight:600;">${fmt(p.price)}</div>
          </div>
        `).join('') : `<div class="empty">Cadastre produtos no módulo Estoque</div>`}
      </div>
      <div class="panel">
        <h2>Carrinho</h2>
        ${cart.length ? cart.map((i,idx)=>`
          <div class="cart-line">
            <span>${i.name} × ${i.qty}</span>
            <span class="mono">${fmt(i.price*i.qty)} <span class="qty-x" data-rm="${idx}">remover</span></span>
          </div>
        `).join('') : `<div class="empty">Carrinho vazio</div>`}
        <div class="cart-total"><span>Total</span><span class="mono">${fmt(cartTotal)}</span></div>
        <div class="field" style="margin-top:14px;">
          <label>Forma de pagamento</label>
          <select id="payMethod">
            <option ${payMethod==='Dinheiro'?'selected':''}>Dinheiro</option>
            <option ${payMethod==='Cartão de débito'?'selected':''}>Cartão de débito</option>
            <option ${payMethod==='Cartão de crédito'?'selected':''}>Cartão de crédito</option>
            <option ${payMethod==='Pix'?'selected':''}>Pix</option>
            <option ${payMethod==='A prazo'?'selected':''}>A prazo</option>
          </select>
        </div>
        ${payMethod==='A prazo' ? `
        <div class="field">
          <label>Cliente</label>
          <div style="display:flex; gap:8px;">
            <select id="creditCustomer" style="flex:1;">
              <option value="">Selecione um cliente...</option>
              ${state.customers.map(c=>`<option value="${c.id}" ${pdvState.customerId===c.id?'selected':''}>${c.name}${c.phone?' · '+c.phone:''}</option>`).join('')}
            </select>
            <button class="btn ghost small" id="quickNewCustomer" type="button">+ Cliente</button>
          </div>
        </div>
        <div class="field">
          <label>Prazo para pagamento</label>
          <select id="creditTerm">
            <option value="30" ${pdvState.term==='30'?'selected':''}>30 dias</option>
            <option value="60" ${pdvState.term==='60'?'selected':''}>60 dias</option>
            <option value="90" ${pdvState.term==='90'?'selected':''}>90 dias</option>
            <option value="custom" ${pdvState.term==='custom'?'selected':''}>Escolher data</option>
          </select>
        </div>
        ${pdvState.term==='custom' ? `
        <div class="field"><label>Data de vencimento</label><input type="date" id="creditDate" value="${pdvState.customDate||''}"></div>
        ` : ''}
        ` : ''}
        <button class="btn accent" id="checkoutBtn" style="width:100%; margin-top:6px;" ${cart.length===0 || !state.cashStatus.open ? 'disabled' : ''}>Finalizar venda</button>
      </div>
    </div>
  `;
}

/* ================= CAIXA ================= */
function renderCaixa(){
  const entradas = state.cash.filter(c=>c.type==='entrada').reduce((s,c)=>s+c.amount,0);
  const saidas = state.cash.filter(c=>c.type==='saida').reduce((s,c)=>s+c.amount,0);
  const saldo = state.cashStatus.opening + entradas - saidas;
  return `
    <div class="topbar"><div><h1>Caixa</h1><p>Controle de entradas e saídas</p></div>
      <div style="display:flex; gap:8px;">
        ${state.cashStatus.open
          ? `<button class="btn danger" id="closeCash">Fechar caixa</button>`
          : `<button class="btn accent" id="openCash">Abrir caixa</button>`}
        <button class="btn ghost" id="resetCash">Zerar caixa</button>
      </div>
    </div>
    <div class="cards">
      <div class="card stat"><div class="label">Status</div><div class="value" style="font-size:16px;">${state.cashStatus.open ? '<span class="badge green">Aberto</span>' : '<span class="badge gray">Fechado</span>'}</div></div>
      <div class="card stat"><div class="label">Abertura</div><div class="value mono">${fmt(state.cashStatus.opening)}</div></div>
      <div class="card stat"><div class="label">Saldo atual</div><div class="value mono pos">${fmt(saldo)}</div></div>
    </div>
    <div class="panel">
      <h2>Lançamento manual</h2>
      <div class="row" style="align-items:end;">
        <div class="field"><label>Descrição</label><input id="cashDesc" placeholder="Ex: Troco, retirada..."></div>
        <div class="field"><label>Valor</label><input id="cashAmount" type="number" step="0.01" placeholder="0,00"></div>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn ghost" id="cashIn" ${!state.cashStatus.open?'disabled':''}>+ Entrada</button>

/* ================= FINANCEIRO ================= */
function renderFinanceiro(){
  const receber = state.finance.filter(f=>f.type==='receber').slice().sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  const pagar = state.finance.filter(f=>f.type==='pagar').slice().sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  const rowsFor = (list, withCustomer) => list.length ? list.map(f=>{
    const cust = f.customerId ? state.customers.find(c=>c.id===f.customerId) : null;
    const late = f.status==='pendente' && isOverdue(f.dueDate);
    return `
    <tr>
      ${withCustomer ? `<td>${cust?cust.name:'—'}</td>` : ''}
      <td>${f.description}</td>
      <td>${new Date(f.dueDate).toLocaleDateString('pt-BR')} ${late?'<span class="badge red">atrasado</span>':''}</td>
      <td class="mono">${fmt(f.amount)}</td>
      <td><span class="badge ${f.status==='pago'?'green':'amber'}">${f.status}</span></td>
      <td style="white-space:nowrap;">${f.status==='pendente' ? `<button class="btn ghost small" data-payfin="${f.id}">Marcar pago</button>` : ''} <button class="btn danger small" data-delfin="${f.id}">Excluir</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="6" class="empty">Nenhum lançamento</td></tr>`;

  return `
    <div class="topbar"><div><h1>Financeiro</h1><p>Contas a pagar e a receber</p></div>
      <button class="btn accent" id="newFinance">+ Novo lançamento</button>
    </div>
    <div class="panel">
      <h2>A receber</h2>
      <table><thead><tr><th>Cliente</th><th>Descrição</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${rowsFor(receber, true)}</tbody></table>
    </div>
    <div class="panel">
      <h2>A pagar</h2>
      <table><thead><tr><th>Descrição</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${rowsFor(pagar, false)}</tbody></table>
    </div>
  `;
}

/* ================= RELATÓRIOS ================= */
function renderRelatorios(){
  const days = [...Array(7)].map((_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(6-i));
    return d;
  });
  const salesByDay = days.map(d=>{
    const key = d.toDateString();
    return state.sales.filter(s=>new Date(s.date).toDateString()===key).reduce((s,v)=>s+v.total,0);
  });
  const maxVal = Math.max(...salesByDay, 1);

  const productTotals = {};
  state.sales.forEach(s=>s.items.forEach(i=>{ productTotals[i.name] = (productTotals[i.name]||0) + i.qty; }));
  const topProducts = Object.entries(productTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return `
    <div class="topbar"><div><h1>Relatórios</h1><p>Análise do desempenho do negócio</p></div></div>
    <div class="panel">
      <h2>Vendas — últimos 7 dias</h2>
      <div class="bar-chart">
        ${salesByDay.map((v,i)=>`
          <div class="bar" style="height:${(v/maxVal*100)||1}%;">
            <span class="val">${v>0?fmt(v):''}</span>
            <span class="lbl">${days[i].toLocaleDateString('pt-BR',{weekday:'short'})}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="panel">
      <h2>Produtos mais vendidos</h2>
      ${topProducts.length ? `<table><thead><tr><th>Produto</th><th>Unidades vendidas</th></tr></thead><tbody>
        ${topProducts.map(([n,q])=>`<tr><td>${n}</td><td class="mono">${q}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">Sem dados de vendas ainda</div>`}
    </div>
  `;
}

/* ---------------- MODAL HELPER ---------------- */
function openModal(html){
  const bg = document.createElement('div');
  bg.className='modal-bg'; bg.id='modalBg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
  document.body.appendChild(bg);
}
function closeModal(){ const bg = document.getElementById('modalBg'); if(bg) bg.remove(); }

/* ---------------- EVENT HANDLERS PER MODULE ---------------- */
function attachHandlers(mod){
  document.querySelectorAll('[data-delsale]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.sales = state.sales.filter(s=>s.id!==el.dataset.delsale);
      await save('sales', state.sales);
      toast('Venda excluída'); render();
    });
  });

  if(mod==='pdv'){
    document.querySelectorAll('[data-add]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const p = state.products.find(x=>x.id===el.dataset.add);
        if(!p || p.stock<=0){ toast('Sem estoque disponível'); return; }
        const existing = cart.find(i=>i.id===p.id);
        if(existing){ if(existing.qty < p.stock) existing.qty++; else { toast('Estoque insuficiente'); return; } }
        else cart.push({id:p.id, name:p.name, price:p.price, qty:1});
        render();
      });
    });
    document.querySelectorAll('[data-rm]').forEach(el=>{
      el.addEventListener('click', (e)=>{ e.stopPropagation(); cart.splice(Number(el.dataset.rm),1); render(); });
    });
    const payMethodEl = document.getElementById('payMethod');
    if(payMethodEl) payMethodEl.addEventListener('change', ()=>{
      pdvState.payMethod = payMethodEl.value;
      render();
    });
    const creditCustomerEl = document.getElementById('creditCustomer');
    if(creditCustomerEl) creditCustomerEl.addEventListener('change', ()=>{ pdvState.customerId = creditCustomerEl.value; });
    const creditTermEl = document.getElementById('creditTerm');
    if(creditTermEl) creditTermEl.addEventListener('change', ()=>{ pdvState.term = creditTermEl.value; render(); });
    const creditDateEl = document.getElementById('creditDate');
    if(creditDateEl) creditDateEl.addEventListener('change', ()=>{ pdvState.customDate = creditDateEl.value; });
    const quickNewBtn = document.getElementById('quickNewCustomer');
    if(quickNewBtn) quickNewBtn.addEventListener('click', ()=>{
      openModal(`<h2>Novo cliente</h2>${customerFormHTML()}<div class="modal-actions"><button class="btn ghost" id="cancelM">Cancelar</button><button class="btn accent" id="saveQuickCust">Salvar</button></div>`);
      document.getElementById('cancelM').onclick = closeModal;
      document.getElementById('saveQuickCust').onclick = async ()=>{
        const name = document.getElementById('cName').value.trim();
        if(!name){ toast('Informe o nome do cliente'); return; }
        const newCust = {
          id:uid(), name, phone:document.getElementById('cPhone').value.trim(),
          cpf:document.getElementById('cCpf').value.trim(), street:document.getElementById('cStreet').value.trim(),
          neighborhood:document.getElementById('cNeighborhood').value.trim(), city:document.getElementById('cCity').value.trim(),
          reference:document.getElementById('cReference').value.trim()
        };
        state.customers.push(newCust);
        await save('customers', state.customers);
        pdvState.customerId = newCust.id;
        closeModal(); toast('Cliente cadastrado'); render();
      };
    });
    const checkout = document.getElementById('checkoutBtn');
    if(checkout) checkout.addEventListener('click', async ()=>{
      const payment = pdvState.payMethod;
      if(payment==='A prazo' && !pdvState.customerId){ toast('Selecione o cliente para venda a prazo'); return; }
      if(payment==='A prazo' && pdvState.term==='custom' && !pdvState.customDate){ toast('Escolha a data de vencimento'); return; }
      const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
      const sale = {id:uid(), date:todayISO(), items:cart.map(i=>({...i})), total, payment, customerId: payment==='A prazo' ? pdvState.customerId : null};
      state.sales.push(sale);
      cart.forEach(i=>{
        const p = state.products.find(x=>x.id===i.id);
        if(p) p.stock -= i.qty;
      });
      if(payment==='Dinheiro'){
        state.cash.push({id:uid(), date:todayISO(), type:'entrada', amount:total, description:'Venda PDV #'+sale.id.slice(-6)});
        await save('cash', state.cash);
      }
      if(payment==='A prazo'){
        let dueDate;
        if(pdvState.term==='custom'){ dueDate = new Date(pdvState.customDate+'T12:00:00').toISOString(); }
        else{ const d = new Date(); d.setDate(d.getDate()+parseInt(pdvState.term)); dueDate = d.toISOString(); }
        const cust = state.customers.find(c=>c.id===pdvState.customerId);
        state.finance.push({
          id:uid(), type:'receber', description:'Venda a prazo #'+sale.id.slice(-6)+(cust?' — '+cust.name:''),
          amount: total, dueDate, status:'pendente', customerId: pdvState.customerId, saleId: sale.id
        });
        await save('finance', state.finance);
      }
      await save('sales', state.sales);
      await save('products', state.products);
      cart = [];
      pdvState = {payMethod:'Dinheiro', customerId:'', term:'30', customDate:''};
      toast('Venda finalizada com sucesso');
      render();
    });
  }

  if(mod==='caixa'){
    const openBtn = document.getElementById('openCash');
    if(openBtn) openBtn.addEventListener('click', ()=>{
      openModal(`
        <h2>Abrir caixa</h2>
        <div class="field"><label>Valor de abertura</label><input id="openingAmt" type="number" step="0.01" placeholder="0,00"></div>
        <div class="modal-actions"><button class="btn ghost" id="cancelM">Cancelar</button><button class="btn accent" id="confirmOpen">Abrir caixa</button></div>
      `);
      document.getElementById('cancelM').onclick = closeModal;
      document.getElementById('confirmOpen').onclick = async ()=>{
        const val = parseFloat(document.getElementById('openingAmt').value)||0;
        state.cashStatus = {open:true, openedAt:todayISO(), opening:val};
        state.cash = [];
        await save('cashStatus', state.cashStatus);
        await save('cash', state.cash);
        closeModal(); toast('Caixa aberto'); render();
      };
    });
    const closeBtn = document.getElementById('closeCash');
    if(closeBtn) closeBtn.addEventListener('click', async ()=>{
      state.cashStatus.open = false;
      await save('cashStatus', state.cashStatus);
      toast('Caixa fechado'); render();
    });
    const inBtn = document.getElementById('cashIn');
    const outBtn = document.getElementById('cashOut');
    const doMove = async (type)=>{
      const desc = document.getElementById('cashDesc').value.trim() || (type==='entrada'?'Entrada manual':'Saída manual');
      const amt = parseFloat(document.getElementById('cashAmount').value);
      if(!amt || amt<=0){ toast('Informe um valor válido'); return; }
      state.cash.push({id:uid(), date:todayISO(), type, amount:amt, description:desc});
      await save('cash', state.cash);
      toast('Movimentação registrada'); render();
    };
    if(inBtn) inBtn.addEventListener('click', ()=>doMove('entrada'));
    if(outBtn) outBtn.addEventListener('click', ()=>doMove('saida'));
    document.querySelectorAll('[data-delcash]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        state.cash = state.cash.filter(c=>c.id!==el.dataset.delcash);
        await save('cash', state.cash);
        toast('Movimentação excluída'); render();
      });
    });
    const resetBtn = document.getElementById('resetCash');
    if(resetBtn) resetBtn.addEventListener('click', ()=>{
      openModal(`
        <h2>Zerar caixa</h2>
        <p style="font-size:13px; color:var(--muted); margin-bottom:14px;">Isso vai apagar todas as movimentações e fechar o caixa. Use para recomeçar do zero.</p>
        <div class="modal-actions"><button class="btn ghost" id="cancelM">Cancelar</button><button class="btn danger" id="confirmReset">Zerar caixa</button></div>
      `);
      document.getElementById('cancelM').onclick = closeModal;
      document.getElementById('confirmReset').onclick = async ()=>{
        state.cash = [];
        state.cashStatus = {open:false, openedAt:null, opening:0};
        await save('cash', state.cash);
        await save('cashStatus', state.cashStatus);
        closeModal(); toast('Caixa zerado'); render();
      };
    });
  }

  if(mod==='estoque'){
    const newBtn = document.getElementById('newProduct');
    if(newBtn) newBtn.addEventListener('click', ()=>{
      openModal(`
        <h2>Novo produto</h2>
        <div class="field"><label>Nome</label><input id="pName"></div>
        <div class="field"><label>Categoria</label><input id="pCat"></div>
        <div class="row">
          <div class="field"><label>Preço de venda</label><input id="pPrice" type="number" step="0.01"></div>
          <div class="field"><label>Custo</label><input id="pCost" type="number" step="0.01"></div>
        </div>
        <div class="field"><label>Estoque inicial</label><input id="pStock" type="number"></div>
        <div class="modal-actions"><button class="btn ghost" id="cancelM">Cancelar</button><button class="btn accent" id="saveProd">Salvar</button></div>
      `);
      document.getElementById('cancelM').onclick = closeModal;
      document.getElementById('saveProd').onclick = async ()=>{
        const name = document.getElementById('pName').value.trim();
        if(!name){ toast('Informe o nome do produto'); return; }
        state.products.push({
          id:uid(), name, category: document.getElementById('pCat').value.trim()||'Geral',
          price: parseFloat(document.getElementById('pPrice').value)||0,
          cost: parseFloat(document.getElementById('pCost').value)||0,
          stock: parseInt(document.getElementById('pStock').value)||0
        });
        await save('products', state.products);
        closeModal(); toast('Produto cadastrado'); render();
      };
    });
    document.querySelectorAll('[data-adjust]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const p = state.products.find(x=>x.id===el.dataset.adjust);
        openModal(`
          <h2>Ajustar estoque — ${p.name}</h2>
          <div class="field"><label>Nova quantidade em estoque</label><input id="adjStock" type="number" value="${p.stock}"></div>
          <div class="modal-actions"><button class="btn ghost" id="cancelM">Cancelar</button><button class="btn accent" id="saveAdj">Salvar</button></div>
        `);
        document.getElementById('cancelM').onclick = closeModal;
        document.getElementById('saveAdj').onclick = async ()=>{
          p.stock = parseInt(document.getElementById('adjStock').value)||0;
          await save('products', state.products);
          closeModal(); toast('Estoque atualizado'); render();
        };
      });
    });
    document.querySelectorAll('[data-delprod]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        state.products = state.products.filter(p=>p.id!==el.dataset.delprod);
        await save('products', state.products);
        toast('Produto excluído'); render();
      });
    });
  }

  if(mod==='clientes'){
    const searchInput = document.getElementById('clientSearchInput');
    if(searchInput){
      searchInput.addEventListener('input', ()=>{ clientSearch = searchInput.value; render(); });
      const pos = searchInput.value.length;
      searchInput.focus(); searchInput.setSelectionRange(pos,pos);
    }
    const newBtn = document.getElementById('newCustomer');
    if(newBtn) newBtn.addEventListener('click', ()=>{
      openModal(`<h2>Novo cliente</h2>${customerFormHTML()}<div class="modal-actions"><button class="btn ghost" id="cancelM">Cancelar</button><button class="btn accent" id="saveCust">Salvar</button></div>`);
      document.getElementById('cancelM').onclick = closeModal;
      document.getElementById('saveCust').onclick = async ()=>{
        const name = document.getElementById('cName').value.trim();
        if(!name){ toast('Informe o nome do cliente'); return; }
        state.customers.push({
          id:uid(), name, phone:document.getElementById('cPhone').value.trim(),
          cpf:document.getElementById('cCpf').value.trim(), street:document.getElementById('cStreet').value.trim(),
          neighborhood:document.getElementById('cNeighborhood').value.trim(), city:document.getElementById('cCity').value.trim(),
          reference:document.getElementById('cReference').value.trim()
        });
        await save('customers', state.customers);
        closeModal(); toast('Cliente cadastrado'); render();
      };
    });
    document.querySelectorAll('[data-editcust]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const c = state.customers.find(x=>x.id===el.dataset.editcust);
        openModal(`<h2>Editar cliente</h2>${customerFormHTML(c)}<div class="modal-actions"><button class="btn ghost" id="cancelM">Cancelar</button><button class="btn accent" id="saveCust">Salvar</button></div>`);
        document.getElementById('cancelM').onclick = closeModal;
        document.getElementById('saveCust').onclick = async ()=>{
          c.name = document.getElementById('cName').value.trim() || c.name;
          c.phone = document.getElementById('cPhone').value.trim();
          c.cpf = document.getElementById('cCpf').value.trim();
          c.street = document.getElementById('cStreet').value.trim();
          c.neighborhood = document.getElementById('cNeighborhood').value.trim();
          c.city = document.getElementById('cCity').value.trim();
          c.reference = document.getElementById('cReference').value.trim();
          await save('customers', state.customers);
          closeModal(); toast('Cliente atualizado'); render();
        };
      });
    });
    document.querySelectorAll('[data-delcust]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        state.customers = state.customers.filter(c=>c.id!==el.dataset.delcust);
        await save('customers', state.customers);
        toast('Cliente excluído'); render();
      });
    });
  }

  if(mod==='financeiro'){
    const newBtn = document.getElementById('newFinance');
    if(newBtn) newBtn.addEventListener('click', ()=>{
      openModal(`
        <h2>Novo lançamento</h2>
        <div class="field"><label>Tipo</label><select id="fType"><option value="receber">A receber</option><option value="pagar">A pagar</option></select></div>
        <div class="field"><label>Descrição</label><input id="fDesc"></div>
        <div class="row">
          <div class="field"><label>Valor</label><input id="fAmount" type="number" step="0.01"></div>
          <div class="field"><label>Vencimento</label><input id="fDue" type="date"></div>
        </div>
        <div class="modal-actions"><button class="btn ghost" id="cancelM">Cancelar</button><button class="btn accent" id="saveFin">Salvar</button></div>
      `);
      document.getElementById('cancelM').onclick = closeModal;
      document.getElementById('saveFin').onclick = async ()=>{
        const desc = document.getElementById('fDesc').value.trim();
        if(!desc){ toast('Informe a descrição'); return; }
        state.finance.push({
          id:uid(), type: document.getElementById('fType').value, description: desc,
          amount: parseFloat(document.getElementById('fAmount').value)||0,
          dueDate: document.getElementById('fDue').value || todayISO(),
          status:'pendente'
        });
        await save('finance', state.finance);
        closeModal(); toast('Lançamento adicionado'); render();
      };
    });
    document.querySelectorAll('[data-payfin]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const f = state.finance.find(x=>x.id===el.dataset.payfin);
        f.status='pago';
        await save('finance', state.finance);
        toast('Marcado como pago'); render();
      });
    });
    document.querySelectorAll('[data-delfin]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        state.finance = state.finance.filter(f=>f.id!==el.dataset.delfin);
        await save('finance', state.finance);
        toast('Lançamento excluído'); render();
      });
    });
  }

  if(mod==='servicos'){
    const newBtn = document.getElementById('newService');
    if(newBtn) newBtn.addEventListener('click', ()=>{
      openModal(`
        <h2>Novo serviço</h2>
        <div class="field"><label>Cliente</label><input id="sClient"></div>
        <div class="field"><label>Descrição</label><input id="sDesc"></div>
        <div class="row">
          <div class="field"><label>Data</label><input id="sDate" type="date"></div>
          <div class="field"><label>Valor</label><input id="sValue" type="number" step="0.01"></div>
        </div>
        <div class="modal-actions"><button class="btn ghost" id="cancelM">Cancelar</button><button class="btn accent" id="saveServ">Salvar</button></div>
      `);
      document.getElementById('cancelM').onclick = closeModal;
      document.getElementById('saveServ').onclick = async ()=>{
        const client = document.getElementById('sClient').value.trim();
        if(!client){ toast('Informe o cliente'); return; }
        state.services.push({
          id:uid(), client, description: document.getElementById('sDesc').value.trim()||'Serviço',
          date: document.getElementById('sDate').value || todayISO(),
          value: parseFloat(document.getElementById('sValue').value)||0,
          status:'agendado'
        });
        await save('services', state.services);
        closeModal(); toast('Serviço agendado'); render();
      };
    });
    document.querySelectorAll('[data-advservice]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const s = state.services.find(x=>x.id===el.dataset.advservice);
        s.status = s.status==='agendado' ? 'em andamento' : 'concluído';
        await save('services', state.services);
        render();
      });
    });
    document.querySelectorAll('[data-delservice]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        state.services = state.services.filter(s=>s.id!==el.dataset.delservice);
        await save('services', state.services);
        toast('Serviço excluído'); render();
      });
    });
  }

  if(mod==='suporte'){
    const newBtn = document.getElementById('newTicket');
    if(newBtn) newBtn.addEventListener('click', ()=>{
      openModal(`
        <h2>Novo chamado</h2>
        <div class="field"><label>Cliente</label><input id="tClient"></div>
        <div class="field"><label>Assunto</label><input id="tSubject"></div>
        <div class="field"><label>Prioridade</label><select id="tPriority"><option value="baixa">Baixa</option><option value="média">Média</option><option value="alta">Alta</option></select></div>
        <div class="modal-actions"><button class="btn ghost" id="cancelM">Cancelar</button><button class="btn accent" id="saveTicket">Abrir chamado</button></div>
      `);
      document.getElementById('cancelM').onclick = closeModal;
      document.getElementById('saveTicket').onclick = async ()=>{
        const client = document.getElementById('tClient').value.trim();
        const subject = document.getElementById('tSubject').value.trim();
        if(!client || !subject){ toast('Preencha cliente e assunto'); return; }
        state.tickets.push({id:uid(), client, subject, priority: document.getElementById('tPriority').value, status:'aberto', date:todayISO()});
        await save('tickets', state.tickets);
        closeModal(); toast('Chamado aberto'); render();
      };
    });
    document.querySelectorAll('[data-resolve]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const t = state.tickets.find(x=>x.id===el.dataset.resolve);
        t.status='resolvido';
        await save('tickets', state.tickets);
        toast('Chamado resolvido'); render();
      });
    });
    document.querySelectorAll('[data-delticket]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        state.tickets = state.tickets.filter(t=>t.id!==el.dataset.delticket);
        await save('tickets', state.tickets);
        toast('Chamado excluído'); render();
      });
    });
  }
}

/* ---------------- INIT ---------------- */
(async function init(){
  document.getElementById('main').innerHTML = `<div class="empty" style="padding:60px;">Carregando sistema...</div>`;
  state = await loadAll();
  seedIfEmpty();
  render();
  checkDueNotifications();

  document.getElementById('resetAllBtn').addEventListener('click', ()=>{
    openModal(`
      <h2>Apagar todos os dados</h2>
      <p style="font-size:13px; color:var(--muted); margin-bottom:14px;">Isso vai apagar produtos, vendas, caixa, financeiro, serviços e chamados. Não pode ser desfeito.</p>
      <div class="modal-actions"><button class="btn ghost" id="cancelM">Cancelar</button><button class="btn danger" id="confirmResetAll">Apagar tudo</button></div>
    `);
    document.getElementById('cancelM').onclick = closeModal;
    document.getElementById('confirmResetAll').onclick = async ()=>{
      Object.values(KEYS).forEach(k=>localStorage.removeItem(k));
      closeModal();
      location.reload();
    };
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

/* Alerta de cobranças do dia — usa notificação do navegador quando permitido */
function checkDueNotifications(){
  const due = state.finance.filter(f=>f.type==='receber' && f.status==='pendente' && (isSameDay(f.dueDate,new Date()) || isOverdue(f.dueDate)));
  if(due.length===0) return;
  const lastCheck = localStorage.getItem('erp:lastNotifyDate');
  const todayKey = new Date().toDateString();
  if(lastCheck === todayKey) return;
  localStorage.setItem('erp:lastNotifyDate', todayKey);
  if(!('Notification' in window)) return;
  const fire = () => {
    try{
      new Notification('Gestão+ — cobranças pendentes', {
        body: `Você tem ${due.length} cobrança(s) vencendo hoje ou atrasada(s).`,
        icon: 'icon-192.png'
      });
    }catch(e){}
  };
  if(Notification.permission==='granted') fire();
  else if(Notification.permission!=='denied'){
    Notification.requestPermission().then(p=>{ if(p==='granted') fire(); });
  }
}
